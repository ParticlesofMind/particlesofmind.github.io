<!doctype html>
<meta charset="utf-8"><title>Sending</title>
<p id="s">Sending images...</p>
<script>
(async () => {
  const names = ["key-art-header.png", "key-art-search.png"];
  for (const n of names) {
    const b = await fetch(n).then((r) => r.blob());
    const to = window.opener || (window.parent !== window ? window.parent : null);
    to && to.postMessage({ name: n, file: new File([b], n, { type: "image/png" }) }, "https://appstoreconnect.apple.com");
  }
  document.getElementById("s").textContent = "Sent. You can close this tab.";
})();
</script>

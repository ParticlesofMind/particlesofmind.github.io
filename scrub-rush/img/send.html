<!doctype html>
<meta charset="utf-8"><title>Sending</title>
<p id="s">Sending images...</p>
<script>
(async () => {
  const names = ["key-art-header.jpg", "key-art-search.jpg"];
  for (const n of names) {
    const b = await fetch(n).then((r) => r.blob());
    window.opener && window.opener.postMessage({ name: n, file: new File([b], n, { type: "image/jpeg" }) }, "https://appstoreconnect.apple.com");
  }
  document.getElementById("s").textContent = "Sent. You can close this tab.";
})();
</script>
